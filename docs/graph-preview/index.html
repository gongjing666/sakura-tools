const RADIUS = (DATA.layout && DATA.layout.radius) || 900;
const mods = DATA.nodes.filter(n => n.type === 'module').sort((a,b) => b.files - a.files);
const labels = {};
const G = ForceGraph3D({controlType:'orbit'})(document.getElementById('g'))
  .backgroundColor('#04070d').showNavInfo(false).graphData(DATA)
  .nodeRelSize(4.2).nodeVal(n => n.val).nodeColor(n => n.color).nodeOpacity(.95)
  .nodeResolution(16)

const list = document.getElementById('mlist');
mods.forEach(m => {

mods.forEach(m => { const s = document.createElement('div'); s.className = 'lbl'; s.textContent = m.label; document.body.appendChild(s); labels[m.id] = s; });
function place() {
  Object.keys(labels).forEach(id => {
    const n = DATA.nodes.find(x => x.id === id), el = labels[id];
    if (!n || n.x === undefined) { el.style.display = 'none'; return; }
    const p = G.graph2ScreenCoords(n.x, n.y, n.z);
    if (p.z > 1400 || p.z < -1400) { el.style.display = 'none'; return; }
    el.style.display = 'block';
    el.style.left = p.x + 'px'; el.style.top = p.y + 'px';
    el.style.opacity = Math.max(.28, Math.min(1, 1 - (p.z - 200) / 1200));
  });
}
function frame() { try { place(); } catch (e) {} requestAnimationFrame(frame); }
requestAnimationFrame(frame);
setTimeout(place, 30); setTimeout(place, 300); setTimeout(place, 1200);
setTimeout(() => { const s3 = DATA.nodes.find(n => n.id === 'mod:src/S3'); if (s3) select(s3); }, 1500);
const detail = document.getElementById('detail');
function idOf(v) { return typeof v === 'string' ? v : v.id; }
function select(n) {
  document.querySelectorAll('.mrow').forEach(r => r.classList.toggle('on', r.dataset.id === n.id));
  const ins = DATA.links.filter(l => idOf(l.target) === n.id).map(l => idOf(l.source));
  const outs = DATA.links.filter(l => idOf(l.source) === n.id).map(l => idOf(l.target));
  const nameOf = id => (DATA.nodes.find(x => x.id === id) || {}).label || id;
  const uniq = a => [...new Set(a)].slice(0, 8);
  detail.className = 'panel show';
  detail.innerHTML = '<div class="kind">' + (n.type === 'module' ? 'MODULE' : 'CLASS') + '</div>'
    + '<h3>' + (n.label || n.id) + '</h3>'
    + '<ul><li>文件数<span>' + (n.files || 1) + '</span></li>'
    + '<li>被引用<span>' + ins.length + '</span></li>'
    + '<li>引用出<span>' + outs.length + '</span></li></ul>'
    + (ins.length ? '<div class="kind" style="margin-top:12px">被谁引用</div><ul>' + uniq(ins).map(i => '<li><span>' + nameOf(i) + '</span></li>').join('') + '</ul>' : '');
  G.nodeColor(x => (x.id === n.id || ins.includes(x.id)) ? '#ffd479' : x.color);
  G.nodeVal(x => x.id === n.id ? x.val * 1.7 : x.val);
}
function focusNode(id, dist) {
  const n = DATA.nodes.find(x => x.id === id); if (!n) return;
  const r = Math.hypot(n.x, n.y, n.z) || 1, k = 1 + dist / r;
  G.cameraPosition({x: n.x * k, y: n.y * k, z: n.z * k}, n, 900);
}
